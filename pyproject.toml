[tool.poetry]
name = "booking-system"
version = "1.0.0"
description = "Room/Resource Scheduling Platform"
authors = ["Booking System Dev <dev@bookingsystem.local>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
Django = ">=5.0,<6.0"
djangorestframework = ">=3.14"
djangorestframework-simplejwt = ">=5.3"
psycopg2-binary = ">=2.9"
python-dotenv = ">=1.0"
django-cors-headers = ">=4.3"
Pillow = ">=10.0"
django-filter = ">=24.0"
drf-spectacular = ">=0.27"
gunicorn = ">=21.0"
whitenoise = ">=6.6"
python-dateutil = ">=2.8"
pytz = ">=2024.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-django = ">=4.8"
pytest-cov = ">=5.0"
factory-boy = ">=3.3"
freezegun = ">=1.4"
coverage = ">=7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
