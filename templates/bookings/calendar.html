{% extends "base.html" %}
{% block title %}Calendar – Booking System{% endblock %}
{% block content %}
<div class="row mb-3">
  <div class="col-md-4">
    <label class="form-label">Resource</label>
    <select id="resourceFilter" class="form-select">
      <option value="">All resources</option>
    </select>
  </div>
  <div class="col-md-8 d-flex align-items-end justify-content-end gap-2">
    {% if user.is_authenticated %}
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#bookingModal">+ New Booking</button>
    {% else %}
      <a href="/accounts/login/" class="btn btn-outline-primary">Login to book</a>
    {% endif %}
  </div>
</div>
<div id="calendar"></div>

<!-- Booking Modal -->
<div class="modal fade" id="bookingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Booking</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="bookingForm">
          <div class="mb-3">
            <label class="form-label">Resource *</label>
            <select name="resource_id" id="modalResource" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label class="form-label">Title *</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="row mb-3">
            <div class="col">
              <label class="form-label">Start *</label>
              <input type="datetime-local" name="start_datetime" class="form-control" required>
            </div>
            <div class="col">
              <label class="form-label">End *</label>
              <input type="datetime-local" name="end_datetime" class="form-control" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Attendees</label>
            <input type="number" name="attendees" class="form-control" value="1" min="1">
          </div>
          <div id="bookingError" class="alert alert-danger d-none"></div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="submitBooking">Book</button>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/calendar.js"></script>
{% endblock %}
